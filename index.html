<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerdas Ceria (C2A) - Aplikasi Belajar SD Kelas 1-6</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --secondary: #06b6d4;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            color: var(--text);
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
        }
        header h1 {
            color: var(--primary);
            margin: 0 0 5px 0;
        }
        header p {
            margin: 0;
            color: #64748b;
        }
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .grid-kelas {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 15px;
        }
        .btn-kelas {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 15px;
            font-size: 1rem;
            font-weight: bold;
            color: var(--primary);
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-kelas:hover {
            border-color: var(--primary);
            background: #eef2ff;
            transform: translateY(-2px);
        }
        .mapel-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        .btn-mapel {
            flex: 1;
            min-width: 120px;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: var(--secondary);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-mapel:hover {
            opacity: 0.9;
        }
        .btn-action {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }
        .btn-action:hover {
            background: var(--primary-hover);
        }
        .option-btn {
            display: block;
            width: 100%;
            padding: 12px 15px;
            margin: 8px 0;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option-btn:hover {
            background: #eef2ff;
            border-color: var(--primary);
        }
        .option-btn.correct {
            background: #d1fae5;
            border-color: var(--success);
            color: #065f46;
        }
        .option-btn.wrong {
            background: #fee2e2;
            border-color: var(--danger);
            color: #991b1b;
        }
        .stats-box {
            display: flex;
            justify-content: space-around;
            background: #eef2ff;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: bold;
            color: var(--primary);
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🌟 Cerdas Ceria (C2A)</h1>
        <p>Aplikasi Belajar & Kuis Interaktif SD Kelas 1 - 6</p>
    </header>

    <div id="step-kelas" class="card">
        <h3>Pilih Tingkat Kelas Kamu:</h3>
        <div class="grid-kelas">
            <button class="btn-kelas" onclick="pilihKelas(1)">Kelas 1</button>
            <button class="btn-kelas" onclick="pilihKelas(2)">Kelas 2</button>
            <button class="btn-kelas" onclick="pilihKelas(3)">Kelas 3</button>
            <button class="btn-kelas" onclick="pilihKelas(4)">Kelas 4</button>
            <button class="btn-kelas" onclick="pilihKelas(5)">Kelas 5</button>
            <button class="btn-kelas" onclick="pilihKelas(6)">Kelas 6</button>
        </div>
    </div>

    <div id="step-mapel" class="card hidden">
        <h3 id="info-kelas-terpilih">Pilih Mata Pelajaran:</h3>
        <div class="mapel-container">
            <button class="btn-mapel" style="background: #4f46e5;" onclick="mulaiKuis('Matematika')">Matematika</button>
            <button class="btn-mapel" style="background: #06b6d4;" onclick="mulaiKuis('Bahasa Indonesia')">Bahasa Indonesia</button>
            <button class="btn-mapel" style="background: #10b981;" onclick="mulaiKuis('IPAS / IPA')">IPAS / IPA</button>
        </div>
        <button class="btn-action" style="background: #64748b; margin-top: 20px;" onclick="kembaliKeKelas()">← Ganti Kelas</button>
    </div>

    <div id="step-kuis" class="card hidden">
        <div class="stats-box">
            <span id="label-progres">Soal: 1 / 3</span>
            <span id="label-skor">Skor: 0</span>
        </div>
        <h3 id="soal-teks" style="margin-bottom: 20px;">Pertanyaan akan muncul disini...</h3>
        <div id="opsi-container"></div>
    </div>

    <div id="step-hasil" class="card hidden" style="text-align: center;">
        <h2>🎉 Kuis Selesai!</h2>
        <p id="pesan-hasil" style="font-size: 1.2rem; margin: 15px 0;"></p>
        <h3 id="skor-akhir" style="color: var(--primary); font-size: 2rem; margin-bottom: 20px;">0</h3>
        <button class="btn-action" onclick="kembaliKeMenuUtama()">Selesai & Kembali ke Menu</button>
    </div>

</div>

<script>
    let kelasAktif = 1;
    let mapelAktif = "";
    let soalIndex = 0;
    let skor = 0;

    const bankSoal = {
        Matematika: [
            { soal: "Berapakah hasil dari 15 + 10?", opsi: ["20", "25", "30", "35"], jawaban: 1 },
            { soal: "Berapa hasil perkalian dari 7 x 8?", opsi: ["54", "56", "64", "62"], jawaban: 1 },
            { soal: "Bentuk desimal dari pecahan 1/2 adalah...", opsi: ["0,5", "0,2", "0,1", "1,2"], jawaban: 0 }
        ],
        "Bahasa Indonesia": [
            { soal: "Sinonim (persamaan kata) dari kata 'Rajin' adalah...", opsi: ["Malas", "Giat", "Lambat", "Bodoh"], jawaban: 1 },
            { soal: "Bagian awal dari sebuah cerita atau dongeng disebut...", opsi: ["Klimaks", "Resolusi", "Orientasi", "Koda"], jawaban: 2 },
            { soal: "Penulisan huruf kapital yang benar terdapat pada kalimat...", opsi: ["ibu pergi ke pasar.", "Budi bermain bola di lapangan.", "kami belajar matematika.", "adi membaca buku."], jawaban: 1 }
        ],
        "IPAS / IPA": [
            { soal: "Alat pernapasan utama pada manusia adalah...", opsi: ["Jantung", "Paru-paru", "Hati", "Lambung"], jawaban: 1 },
            { soal: "Tumbuhan hijau membuat makanannya sendiri melalui proses...", opsi: ["Fotosintesis", "Respirasi", "Erosi", "Transpirasi"], jawaban: 0 },
            { soal: "Planet tata surya yang paling dekat dengan matahari adalah...", opsi: ["Venus", "Bumi", "Mars", "Merkurius"], jawaban: 3 }
        ]
    };

    function pilihKelas(tingkat) {
        kelasAktif = tingkat;
        document.getElementById('info-kelas-terpilih').innerText = `Kelas ${tingkat} - Pilih Mata Pelajaran:`;
        document.getElementById('step-kelas').classList.add('hidden');
        document.getElementById('step-mapel').classList.remove('hidden');
    }

    function kembaliKeKelas() {
        document.getElementById('step-mapel').classList.add('hidden');
        document.getElementById('step-kelas').classList.remove('hidden');
    }

    function mulaiKuis(mapel) {
        mapelAktif = mapel;
        soalIndex = 0;
        skor = 0;
        document.getElementById('step-mapel').classList.add('hidden');
        document.getElementById('step-kuis').classList.remove('hidden');
        tampilkanSoal();
    }

    function tampilkanSoal() {
        const dataSoal = bankSoal[mapelAktif][soalIndex];
        document.getElementById('label-progres').innerText = `Soal: ${soalIndex + 1} / ${bankSoal[mapelAktif].length}`;
        document.getElementById('label-skor').innerText = `Skor: ${skor}`;
        document.getElementById('soal-teks').innerText = dataSoal.soal;

        const opsiContainer = document.getElementById('opsi-container');
        opsiContainer.innerHTML = "";

        dataSoal.opsi.forEach((teksOpsi, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = teksOpsi;
            btn.onclick = () => cekJawaban(idx, dataSoal.jawaban, btn);
            opsiContainer.appendChild(btn);
        });
    }

    function cekJawaban(pilihan, benar, tombol) {
        const semuaOpsi = document.querySelectorAll('.option-btn');
        semuaOpsi.forEach(b => b.disabled = true);

        if (pilihan === benar) {
            tombol.classList.add('correct');
            skor += 10;
        } else {
            tombol.classList.add('wrong');
            semuaOpsi[benar].classList.add('correct');
        }

        setTimeout(() => {
            soalIndex++;
            if (soalIndex < bankSoal[mapelAktif].length) {
                tampilkanSoal();
            } else {
                tampilkanHasil();
            }
        }, 1200);
    }

    function tampilkanHasil() {
        document.getElementById('step-kuis').classList.add('hidden');
        document.getElementById('step-hasil').classList.remove('hidden');
        document.getElementById('skor-akhir').innerText = `Total Skor: ${skor}`;
        
        let pesan = "Hebat! Pertahankan prestasi belajarmu! 🌟";
        if (skor < 20) pesan = "Tetap semangat belajar ya! Coba lagi yuk 💪";
        document.getElementById('pesan-hasil').innerText = pesan;
    }

    function kembaliKeMenuUtama() {
        document.getElementById('step-hasil').classList.add('hidden');
        document.getElementById('step-kelas').classList.remove('hidden');
    }
</script>

</body>
</html>
