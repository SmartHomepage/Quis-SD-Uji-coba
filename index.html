<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerdas Ceria (C2A) - MIM Wonoanti EduQuiz </title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --secondary: #06b6d4;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 24px;
            margin: 16px;
            box-sizing: border-box;
        }

        h1, h2 {
            text-align: center;
            color: var(--primary);
            margin-top: 0;
        }

        p {
            text-align: center;
            color: #64748b;
        }

        .grid-menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(79, 70, 229, 0.2);
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-mapel {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            text-align: left;
            padding: 20px;
            font-size: 18px;
        }

        .btn-opsi {
            background-color: #f8fafc;
            color: var(--text);
            border: 2px solid #e2e8f0;
            width: 100%;
            margin-bottom: 10px;
            text-align: left;
            box-shadow: none;
        }

        .btn-opsi:hover {
            background-color: #e0e7ff;
            border-color: var(--primary);
            color: var(--primary);
            transform: none;
        }

        .hidden {
            display: none !important;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: bold;
            color: #64748b;
            font-size: 14px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
        }

        .question-box {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #1e293b;
        }

        .result-card {
            text-align: center;
            padding: 20px 0;
        }

        .score-display {
            font-size: 36px;
            font-weight: bold;
            color: var(--primary);
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- MENU PILIH KELAS -->
    <div id="step-kelas">
        <h1>Cerdas Ceria (C2A)</h1>
        <p>Pilih tingkat kelas anak:</p>
        <div class="grid-menu" style="grid-template-columns: 1fr;">
            <button onclick="pilihKelas('Kelas 1')" class="btn-mapel" style="text-align:center;">🌟 Kelas 1 SD</button>
            <button onclick="pilihKelas('Kelas 2')" class="btn-mapel" style="text-align:center;">🚀 Kelas 2 SD</button>
            <button onclick="pilihKelas('Kelas 3')" class="btn-mapel" style="text-align:center;">🏆 Kelas 3 SD</button>
        </div>
    </div>

    <!-- MENU PILIH MATA PELAJARAN -->
    <div id="step-mapel" class="hidden">
        <h2 id="teks-kelas">Pilih Mata Pelajaran</h2>
        <p>Silakan pilih bidang pelajaran yang ingin diuji:</p>
        <div class="grid-menu">
            <button onclick="pilihMapel('Matematika')" class="btn-mapel">📐 Matematika</button>
            <button onclick="pilihMapel('Bahasa Indonesia')" class="btn-mapel">📖 B. Indonesia</button>
            <button onclick="pilihMapel('IPA')" class="btn-mapel">🌱 IPA</button>
            <button onclick="pilihMapel('IPS')" class="btn-mapel">🌍 IPS</button>
            <button onclick="pilihMapel('PPKn')" class="btn-mapel">🇮🇩 PPKn</button>
            <button onclick="pilihMapel('Bahasa Inggris')" class="btn-mapel">🔤 B. Inggris</button>
        </div>
        <button onclick="kembaliKeKelas()" style="margin-top: 20px; background-color: #64748b; width: 100%;">← Kembali Pilih Kelas</button>
    </div>

    <!-- HALAMAN KUIS -->
    <div id="step-kuis" class="hidden">
        <div class="quiz-header">
            <span id="label-mapel-kelas">Matematika - Kelas 1</span>
            <span id="label-nomor">Soal 1 dari 15</span>
        </div>
        <div class="question-box" id="soal-teks">Pertanyaan akan muncul di sini...</div>
        <div id="opsi-container">
            <!-- Pilihan ganda akan dimasukkan lewat script -->
        </div>
    </div>

    <!-- HALAMAN HASIL -->
    <div id="step-hasil" class="hidden result-card">
        <h2>Kuis Selesai! 🎉</h2>
        <p>Hebat, kamu telah menyelesaikan seluruh soal latihan.</p>
        <div class="score-display" id="skor-akhir">Total Skor: 0</div>
        <p id="pesan-hasil" style="font-weight: 600; font-size: 16px; margin-bottom: 25px;"></p>
        <button onclick="kembaliKeMenuUtama()" style="width: 100%;">Menu Utama 🏠</button>
    </div>
</div>

            {t: "Pulau terbesar di wilayah Indonesia adalah...", o: ["Jawa", "Sumatera", "Kalimantan", "Bali"], j: 2},

            {t: "Uang kertas pecahan berwarna merah bernilai...", o: ["Rp10.000", "Rp20.000", "Rp50.000", "Rp100.000"], j: 3},
            {t: "Laut yang sangat luas dinamakan...", o: ["Danau", "Selat", "Samudra", "Sungai"], j: 2},
            {t: "Pakaian adat tradisional dari suku Jawa dinamakan...", o: ["Ulos", "Batik/Kebaya", "Baju Bodo", "Peningset"], j: 1},
            {t: "Kepala desa biasanya memimpin suatu wilayah tingkat...", o: ["Kecamatan", "Desa / Kelurahan", "Kabupaten", "Provinsi"], j: 1},
            {t: "Alat transportasi udara resmi adalah...", o: ["Kapal laut", "Kereta", "Pesawat terbang", "Bus"], j: 2},
            {t: "Hari Kemerdekaan Republik Indonesia diperingati setiap tanggal...", o: ["1 Januari", "17 Agustus", "28 Oktober", "10 November"], j: 1},
            {t: "Provinsi Bali terkenal sebagai pusat pariwisata berjuluk Pulau...", o: ["Dewata", "Seribu Candi", "Pijar", "Emas"], j: 0}
        ],

            {t: "Dasar negara Indonesia adalah...", o: ["UUD 1945", "Pancasila", "Bhineka Tunggal Ika", "Garuda"], j: 1},
            {t: "Sila pertama Pancasila berbunyi Ketuhanan yang...", o: ["Maha Esa", "Adil dan Beradab", "Persatuan Indonesia", "Rakyat"], j: 0},

    function pilihKelas(kelas) {
        kelasAktif = kelas;
        document.getElementById('step-kelas').classList.add('hidden');
        document.getElementById('step-mapel').classList.remove('hidden');
        document.getElementById('teks-kelas').innerText = `Pilih Mata Pelajaran (${kelas})`;
    }

    function kembaliKeKelas() {
        document.getElementById('step-mapel').classList.add('hidden');
        document.getElementById('step-kelas').classList.remove('hidden');
    }

    function pilihMapel(mapel) {
        mapelAktif = mapel;
        soalIndeks = 0;
        skor = 0;
        daftarSoalAktif = bankSoal[mapel];

        document.getElementById('step-mapel').classList.add('hidden');
        document.getElementById('step-kuis').classList.remove('hidden');
        document.getElementById('label-mapel-kelas').innerText = `${mapel} - ${kelasAktif}`;
        
        muatSoal();
    }

    function muatSoal() {
        if (soalIndeks < daftarSoalAktif.length) {
            let curr = daftarSoalAktif[soalIndeks];
            document.getElementById('label-nomor').innerText = `Soal ${soalIndeks + 1} dari ${daftarSoalAktif.length}`;
            document.getElementById('soal-teks').innerText = curr.t;

            let opsiHtml = '';
            for (let i = 0; i < curr.o.length; i++) {
                opsiHtml += `<button class="btn-opsi" onclick="jawab(${i})">${String.fromCharCode(65 + i)}. ${curr.o[i]}</button>`;
            }
            document.getElementById('opsi-container').innerHTML = opsiHtml;
        } else {
            tampilkanHasil();
        }
    }

    function jawab(pilihanIndex) {
        let curr = daftarSoalAktif[soalIndeks];
        if (pilihanIndex === curr.j) {
            skor += 10; // Menambah poin per jawaban benar
        }
        soalIndeks++;
        muatSoal();
    }

    function tampilkanHasil() {
        document.getElementById('step-kuis').classList.add('hidden');
        document.getElementById('step-hasil').classList.remove('hidden');
        document.getElementById('skor-akhir').innerText = `Total Skor: ${skor}`;
        
        let pesan = "Hebat! Pertahankan prestasi belajarmu! 🌟";
        if (skor < 70) pesan = "Tetap semangat belajar ya! Coba lagi yuk 💪";
        document.getElementById('pesan-hasil').innerText = pesan;
    }

    function kembaliKeMenuUtama() {
        document.getElementById('step-hasil').classList.add('hidden');
        document.getElementById('step-kelas').classList.remove('hidden');
    }
</script>

</body>
</html>
