<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIM Wonoanti EduQuiz</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --secondary: #06b6d4;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 24px;
            margin: 16px;
            box-sizing: border-box;
        }

        h1, h2 {
            text-align: center;
            color: var(--primary);
            margin-top: 0;
        }

        p {
            text-align: center;
            color: #64748b;
        }

        .grid-menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(79, 70, 229, 0.2);
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-mapel {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            text-align: center;
            padding: 16px;
            font-size: 16px;
        }

        .btn-opsi {
            background-color: #f8fafc;
            color: var(--text);
            border: 2px solid #e2e8f0;
            width: 100%;
            margin-bottom: 10px;
            text-align: left;
            box-shadow: none;
        }

        .btn-opsi:hover {
            background-color: #e0e7ff;
            border-color: var(--primary);
            color: var(--primary);
            transform: none;
        }

        .hidden {
            display: none !important;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: bold;
            color: #64748b;
            font-size: 14px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
        }

        .question-box {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #1e293b;
            line-height: 1.5;
        }

        .result-card {
            text-align: center;
            padding: 20px 0;
        }

        .score-display {
            font-size: 36px;
            font-weight: bold;
            color: var(--primary);
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- MENU PILIH KELAS -->
    <div id="step-kelas">
        <h1>MIM Wonoanti EduQuiz</h1>
        <p>Pilih tingkat kelas anak:</p>
        <div class="grid-menu" style="grid-template-columns: 1fr 1fr;">
            <button onclick="pilihKelas('Kelas 1')" class="btn-mapel">🌟 Kelas 1 SD</button>

        <div id="opsi-container">

        </div>
    </div>

        <button onclick="kembaliKeMenuUtama()" style="width: 100%;">Menu Utama 🏠</button>
    </div>
</div>

    function pilihKelas(kelas) {
        kelasAktif = kelas;
        document.getElementById('step-kelas').classList.add('hidden');
        document.getElementById('step-mapel').classList.remove('hidden');
        document.getElementById('teks-kelas').innerText = `Pilih Mata Pelajaran (${kelas})`;

        // Render tombol mapel berdasarkan kelas
        let mapelList = daftarMapelPerKelas[kelas];
        let htmlMapel = '';
        mapelList.forEach(m => {
            let icon = "📖";
            if(m === "Matematika") icon = "📐";
            else if(m === "IPA" || m === "IPAS") icon = "🌱";
            else if(m === "IPS") icon = "🌍";
            else if(m === "PPKn") icon = "🇮🇩";
            else if(m === "Bahasa Inggris") icon = "🔤";

            htmlMapel += `<button onclick="pilihMapel('${m}')" class="btn-mapel">${icon} ${m}</button>`;
        });

        document.getElementById('container-mapel').innerHTML = htmlMapel;
    }

    function kembaliKeKelas() {
        document.getElementById('step-mapel').classList.add('hidden');
        document.getElementById('step-kelas').classList.remove('hidden');
    }

    function pilihMapel(mapel) {
        mapelAktif = mapel;
        soalIndeks = 0;
        jumlahBenar = 0;
        daftarSoalAktif = bankSoal[kelasAktif][mapel];

        document.getElementById('step-mapel').classList.add('hidden');
        document.getElementById('step-kuis').classList.remove('hidden');
        document.getElementById('label-mapel-kelas').innerText = `${mapel} - ${kelasAktif}`;
        
        muatSoal();
    }

    function muatSoal() {
        if (soalIndeks < daftarSoalAktif.length) {
            let curr = daftarSoalAktif[soalIndeks];
            document.getElementById('label-nomor').innerText = `Soal ${soalIndeks + 1} dari ${daftarSoalAktif.length}`;
            document.getElementById('soal-teks').innerText = curr.t;

            let opsiHtml = '';
            for (let i = 0; i < curr.o.length; i++) {
                opsiHtml += `<button class="btn-opsi" onclick="jawab(${i})">${String.fromCharCode(65 + i)}. ${curr.o[i]}</button>`;
            }
            document.getElementById('opsi-container').innerHTML = opsiHtml;
        } else {
            tampilkanHasil();
        }
    }

    function jawab(pilihanIndex) {
        let curr = daftarSoalAktif[soalIndeks];
        if (pilihanIndex === curr.j) {
            jumlahBenar++;
        }
        soalIndeks++;
        muatSoal();
    }

    function tampilkanHasil() {
        document.getElementById('step-kuis').classList.add('hidden');
        document.getElementById('step-hasil').classList.remove('hidden');
        
        // Kalkulasi Skor skala 100
        let totalSoal = daftarSoalAktif.length;
        let skorAkhir = Math.round((jumlahBenar / totalSoal) * 100);

        document.getElementById('skor-akhir').innerText = `Total Skor: ${skorAkhir}`;
        
        let pesan = "Hebat! Pertahankan prestasi belajarmu! 🌟";
        if (skorAkhir < 70) {
            pesan = "Tetap semangat belajar ya! Coba lagi yuk 💪";
        } else if (skorAkhir === 100) {
            pesan = "Luar Biasa! Nilai Sempurna! 🎉🏆";
        }
        document.getElementById('pesan-hasil').innerText = pesan;
    }

    function kembaliKeMenuUtama() {
        document.getElementById('step-hasil').classList.add('hidden');
        document.getElementById('step-kelas').classList.remove('hidden');
    }
